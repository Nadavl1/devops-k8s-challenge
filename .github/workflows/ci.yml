name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/nadavl1/devops-k8s-challenge
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run application tests
        run: npm test

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Semgrep SAST
        run: |
          python -m pip install --upgrade semgrep
          semgrep scan --config p/security-audit --error

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: helm lint ./devops-k8s-challenge

      - name: Render Helm chart
        run: helm template test ./devops-k8s-challenge

      - name: Build Docker image
        run: |
          APP_VERSION="$(sed -n 's/^appVersion: "\([^"]*\)"/\1/p' ./devops-k8s-challenge/Chart.yaml)"
          test -n "$APP_VERSION"
          IMAGE_REF="$IMAGE_NAME:$APP_VERSION"
          COMMIT_IMAGE="$IMAGE_NAME:$GITHUB_SHA"
          docker build --tag "$IMAGE_REF" --tag "$COMMIT_IMAGE" .
          printf 'IMAGE_REF=%s\nCOMMIT_IMAGE=%s\n' "$IMAGE_REF" "$COMMIT_IMAGE" >> "$GITHUB_ENV"

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: table
          exit-code: '1'
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE_REF"
          docker push "$COMMIT_IMAGE"