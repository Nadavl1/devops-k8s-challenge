name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run application tests
        run: npm test

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Semgrep SAST
        run: |
          python -m pip install --upgrade semgrep
          semgrep scan --config p/security-audit --error

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: helm lint ./devops-k8s-challenge

      - name: Validate application versions
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          APP_VERSION="$(sed -n 's/^appVersion: "\([^"]*\)"/\1/p' ./devops-k8s-challenge/Chart.yaml)"
          test -n "$APP_VERSION"
          if [ "$PACKAGE_VERSION" != "$APP_VERSION" ]; then
            echo "package.json version ($PACKAGE_VERSION) must match Helm appVersion ($APP_VERSION)"
            exit 1
          fi

      - name: Render Helm chart
        run: helm template test ./devops-k8s-challenge
  publish:
    name: Publish and promote image
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      IMAGE_NAME: ghcr.io/nadavl1/devops-k8s-challenge
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Docker image
        run: |
          APP_VERSION="$(sed -n 's/^appVersion: "\([^"]*\)"/\1/p' ./devops-k8s-challenge/Chart.yaml)"
          test -n "$APP_VERSION"
          IMAGE_REF="$IMAGE_NAME:$APP_VERSION"
          COMMIT_IMAGE="$IMAGE_NAME:$GITHUB_SHA"
          docker build --tag "$IMAGE_REF" --tag "$COMMIT_IMAGE" .
          printf 'IMAGE_REF=%s\nCOMMIT_IMAGE=%s\n' "$IMAGE_REF" "$COMMIT_IMAGE" >> "$GITHUB_ENV"

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: table
          exit-code: '1'
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image and capture digest
        run: |
          PUSH_OUTPUT="$(docker push "$IMAGE_REF" 2>&1)"
          printf '%s\n' "$PUSH_OUTPUT"
          IMAGE_DIGEST="$(printf '%s\n' "$PUSH_OUTPUT" | sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' | tail -n 1)"
          test -n "$IMAGE_DIGEST"
          docker push "$COMMIT_IMAGE"
          printf 'IMAGE_DIGEST=%s\n' "$IMAGE_DIGEST" >> "$GITHUB_ENV"

      - name: Promote digest to GitOps branch
        run: |
          git fetch origin
          git checkout -B gitops origin/gitops
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit origin/main
          sed -i -E "s|^  digest:.*|  digest: \"$IMAGE_DIGEST\"|" ./devops-k8s-challenge/values.yaml
          if ! git diff --quiet -- ./devops-k8s-challenge/values.yaml; then
            git add ./devops-k8s-challenge/values.yaml
            git commit -m "Promote image ${IMAGE_DIGEST}"
          fi
          git push origin HEAD:gitops