apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "devops-k8s-challenge.fullname" . }}-test-connection"
  labels:
    {{- include "devops-k8s-challenge.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: docker.io/library/busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
      command: ['wget']
      args: ['{{ include "devops-k8s-challenge.fullname" . }}:{{ .Values.service.port }}/my-app']
  restartPolicy: Never
